[project]
name = "hamkharid-api"
version = "0.1.0"
description = "Transactional collective purchasing marketplace"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
]

[dependency-groups]
dev = ["ruff>=0.14,<0.15"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
