services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hamkharid}
      POSTGRES_USER: ${POSTGRES_USER:-hamkharid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamkharid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hamkharid-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hamkharid-postgres-data:
